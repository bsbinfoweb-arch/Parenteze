<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Carte Parenteze
</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet/dist/leaflet.css"
/>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<style>

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  background:#f5f7fb;
}

.dashboard{
  display:grid;
  grid-template-columns:300px 1fr 280px;
  height:100vh;
}

.sidebar{
  background:#fff;
  padding:25px;
  border-right:1px solid #e5e7eb;
}

.sidebar h2{
  margin-top:0;
  color:#159447;
}

.filter{
  margin-bottom:18px;
}

.filter label{
  display:block;
  margin-bottom:8px;
  font-weight:700;
}

.filter select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #ddd;
}

#map{
  width:100%;
  height:100vh;
}

.stats{
  background:#fff;
  padding:25px;
  border-left:1px solid #e5e7eb;
}

.stat-card{
  background:#f7faf8;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
}

.stat-card h3{
  margin:0;
  color:#159447;
  font-size:30px;
}

.stat-card p{
  margin:8px 0 0;
  color:#555;
}

@media(max-width:980px){

  .dashboard{
    grid-template-columns:1fr;
  }

  .sidebar,
  .stats{
    display:none;
  }

}

</style>

</head>

<body>

<div class="dashboard">

  <!-- LEFT -->

  <div class="sidebar">

    <h2>
      📍 Explorer
    </h2>

    <div class="filter">

      <label>
        Commune
      </label>

    <select id="communeSelect">

  <option value="">
    Toutes les communes
  </option>

  <option value="pointeapitre">
    Pointe-à-Pitre
  </option>

  <option value="baiemahault">
    Baie-Mahault
  </option>

  <option value="lesabymes">
    Les Abymes
  </option>

  <option value="mornealeau">
    Morne-à-l’Eau
  </option>

</select>

    </div>

    <div class="filter">

<select id="communeSelect">

  <option value="">
    Toutes les communes
  </option>

</select>

<select id="typeSelect">

  <option value="">
    Tous les types
  </option>

  <option value="École élémentaire publique">
    École élémentaire publique
  </option>

  <option value="École privée">
    École privée
  </option>

  <option value="Collège public">
    Collège public
  </option>

  <option value="Collège privé">
    Collège privé
  </option>

  <option value="Lycée public">
    Lycée public
  </option>

  <option value="Lycée privé">
    Lycée privé
  </option>

  <option value="Lycée professionnel public">
    Lycée professionnel public
  </option>

  <option value="Lycée professionnel privé">
    Lycée professionnel privé
  </option>

</select>

<select id="etablissementSelect">

  <option value="">
    Tous les établissements
  </option>

</select>

<button id="searchBtn">
  Rechercher
</button>

    </div>

  </div>

  <!-- MAP -->

  <div id="map"></div>

  <!-- RIGHT -->

  <div class="stats">

    <div class="stat-card">
      <h3>245</h3>
      <p>Annonces publiées</p>
    </div>

    <div class="stat-card">
      <h3>38</h3>
      <p>Établissements</p>
    </div>

    <div class="stat-card">
      <h3>412</h3>
      <p>Parents inscrits</p>
    </div>

    <div class="stat-card">
      <h3>97</h3>
      <p>Dons réalisés</p>
    </div>

  </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const supabaseClient = supabase.createClient(
  window.APP_CONFIG.SUPABASE_URL,
  window.APP_CONFIG.SUPABASE_ANON_KEY
);
const map = L.map('map').setView([16.25,-61.55],9);

L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  {
    attribution:'© OpenStreetMap © CARTO',
    subdomains:'abcd',
    maxZoom:20
  }
).addTo(map);
/* =========================
   ETABLISSEMENTS LIVE
========================= */

async function loadEtablissements(){

  const { data, error } =

    await supabaseClient

      .from("etablissements")

      .select("*");

  if(error){

    console.error(error);
    return;

  }

  data.forEach((etablissement)=>{

    if(
      !etablissement.latitude ||
      !etablissement.longitude
    ){
      return;
    }

    L.marker([

      etablissement.latitude,
      etablissement.longitude

    ])

    .addTo(map)

    .bindPopup(`

      <strong>
        ${etablissement.name}
      </strong>

      <br>

      ${etablissement.type}

      <br>

      📍 ${etablissement.commune}

    `);

  });

}

loadEtablissements();
/* =========================
   COMMUNES LIVE
========================= */

const communeSelect =
  document.getElementById("communeSelect");

async function loadCommunes(){

  const { data, error } =

    await supabaseClient

      .from("communes")

      .select("*")

      .order("nom");

  if(error){

    console.error(error);
    return;

  }

  data.forEach((commune)=>{

    const option =
      document.createElement("option");

    option.value = commune.id;

    option.textContent = commune.nom;

    option.dataset.lat =
      commune.latitude;

    option.dataset.lng =
      commune.longitude;

    option.dataset.zoom =
      commune.zoom;

    communeSelect.appendChild(option);

  });

}

loadCommunes();

communeSelect.addEventListener(
  "change",
  (e)=>{

    const selected =
      e.target.selectedOptions[0];

    const lat =
      selected.dataset.lat;

    const lng =
      selected.dataset.lng;

    const zoom =
      selected.dataset.zoom;

    if(!lat){

      map.setView(
        [16.25,-61.55],
        9
      );

      return;

    }

    map.flyTo(

      [lat,lng],

      zoom,

      {
        duration:1.5
      }

    );

});
</script>

</body>
</html>
