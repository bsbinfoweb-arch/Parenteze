<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>
    Connexion - Parenteze
  </title>

  <link rel="stylesheet" href="css/style.css" />

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script src="js/config.js"></script>

  <script defer src="js/auth.js"></script>
</head>

<body class="page">

  <main class="auth-card premium-auth">

    <div class="auth-branding">

      <img
        src="assets/logo-parenteze.png"
        alt="Parenteze"
        class="auth-logo"
      >

      <h1>
        Bienvenue sur Parenteze
      </h1>

      <p>
        La plateforme des parents d’élèves de Guadeloupe.
      </p>

    </div>

    <button
      id="googleLogin"
      class="google-btn"
    >

      <img
        src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"
        alt="Google"
      >

      <span>
        Continuer avec Google
      </span>

    </button>

    <div class="auth-separator">
      <span>ou</span>
    </div>

    <input
      id="email"
      type="email"
      placeholder="Adresse email"
    >

    <input
      id="password"
      type="password"
      placeholder="Mot de passe"
    >

    <label class="check">

      <input
        type="checkbox"
        id="rgpd"
      >

      J’accepte la politique de confidentialité.

    </label>

    <button
      class="btn btn-primary full"
      id="emailLogin"
    >
      Se connecter
    </button>

    <button
      class="btn btn-outline full"
      id="emailSignup"
    >
      Créer un compte
    </button>

    <p id="authMessage"></p>

    <div class="auth-footer-links">

      <a href="index.html">
        ← Retour accueil
      </a>

      <a href="privacy.html">
        Politique de confidentialité
      </a>

    </div>

  </main>

</body>
</html>
