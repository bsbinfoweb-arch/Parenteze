<!-- login.html -->
<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Connexion - Parenteze
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  />

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script src="js/config.js"></script>

  <script defer src="js/auth.js"></script>

</head>

<body class="login-page">

  <div class="login-layout">

    <!-- LEFT -->
    <div class="login-left">

      <div class="login-card">

        <img
          src="assets/logo-parenteze.png"
          alt="Parenteze"
          class="login-logo"
        >

        <h1>
          S'inscrire
        </h1>

        <p class="login-subtitle">
          Rejoignez la communauté des parents et restez connectés à la vie scolaire.
        </p>

        <!-- GOOGLE -->

        <button
          id="googleLogin"
          class="google-btn"
        >

          <img
            src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"
            alt="Google"
          >

          <span>
            S'inscrire avec Google
          </span>

        </button>

        <!-- SEPARATOR -->

        <div class="separator">

          <div></div>

          <span>
            ou
          </span>

          <div></div>

        </div>

        <p class="separator-text">
          inscrivez-vous avec votre e-mail
        </p>

        <!-- EMAIL -->

        <input
          id="email"
          type="email"
          placeholder="Saisissez votre adresse e-mail"
        >

        <!-- PASSWORD -->

        <input
          id="password"
          type="password"
          placeholder="Saisissez votre mot de passe"
        >

        <!-- RGPD -->

        <label class="login-check">

          <input
            type="checkbox"
            id="rgpd"
          >

          <span>
            J'accepte la politique de confidentialité
            et les conditions générales d'utilisation.
          </span>

        </label>

        <!-- BUTTON -->

        <button
          id="emailSignup"
          class="signup-btn"
        >
          S'inscrire
        </button>

        <!-- LOGIN -->

        <p class="login-switch">

          Vous avez déjà un compte ?

          <button
            id="emailLogin"
            class="link-btn"
          >
            Se connecter
          </button>

        </p>

        <p id="authMessage"></p>

      </div>

    </div>

    <!-- RIGHT -->

    <div class="login-right">

      <div class="right-overlay">
        <img
          src="assets/guadeloupe-login.png"
          alt="Guadeloupe"
          class="hero-map"
        >

      </div>

    </div>

  </div>

</body>

</html>
