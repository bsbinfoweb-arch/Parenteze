<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Déposer une annonce - Parents Market 971</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script defer src="js/post.js"></script>
</head>
<body class="page">
 <body class="page">

  <main class="form-card">

    <div
      style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:20px;
        flex-wrap:wrap;
        margin-bottom:30px;
      "
    >

      <div
        style="
          display:flex;
          align-items:center;
          gap:15px;
        "
      >

        <img
          src="assets/logo-parenteze.png"

          alt="Parenteze"

          style="
            width:70px;
            height:auto;
          "
        >

        <div>

          <h1
            style="
              margin:0;
            "
          >
            Déposer une annonce
          </h1>

          <p
            style="
              margin:5px 0 0;
              color:#666;
            "
          >
            Publiez votre annonce facilement
          </p>

        </div>

      </div>

      <a
        class="btn btn-outline"
        href="mes-annonces.html"
      >
        📦 Mes annonces
      </a>

    </div>

    <input
      id="title"
      placeholder="Titre de l’annonce"
    >

    <textarea
      id="description"
      placeholder="Description"
    ></textarea>

    <input
      id="price"
      type="number"
      placeholder="Prix, laisser vide si gratuit"
    >

    <select id="annonceType">

      <option value="sell">
        💰 À vendre
      </option>

      <option value="donate">
        🎁 À donner
      </option>

      <option value="search">
        🔎 Je recherche
      </option>

    </select>

    <select id="category"></select>

    <select id="commune">
      <option value="">
        Choisir une commune
      </option>
    </select>

    <select id="etablissement">
      <option value="">
        Choisir un établissement
      </option>
    </select>

    <input
      id="photos"
      type="file"
      accept="image/*"
      multiple
    >

    <select id="contactType">

      <option value="email">
        📧 Email
      </option>

      <option value="phone">
        📱 Téléphone
      </option>

    </select>

    <input
      id="contactValue"
      placeholder="Votre email ou numéro"
    >

    <button
      class="btn btn-primary full"
      id="submitAd"
    >
      🚀 Envoyer pour validation
    </button>

    <p id="postMessage"></p>

  </main>

</body>
</body>
</html>
