<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Déposer une annonce - Parents Market 971</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script defer src="js/post.js"></script>
</head>
<body class="page">
  <main class="form-card">
    <h1>Déposer une annonce</h1>
    <p>Ton annonce sera validée avant publication.</p>
    <input id="title" placeholder="Titre de l’annonce">
    <textarea id="description" placeholder="Description"></textarea>
    <input id="price" type="number" placeholder="Prix, laisser vide si gratuit">
    <select id="annonceType">
      <option value="sell">À vendre</option>
      <option value="donate">À donner</option>
      <option value="search">Je recherche</option>
    </select>
    <select id="category"></select>
 <select id="commune">
  <option value="">
    Choisir une commune
  </option>
</select>

<select id="etablissement">
  <option value="">
    Choisir un établissement
  </option>
</select>
    <input
  id="photos"
  type="file"
  accept="image/*"
  multiple
>
<label
  for="contactType"

  style="
    display:block;
    margin:18px 0 10px;
    font-weight:700;
  "
>
  Comment souhaitez-vous être contacté ?
</label>

<select id="contactType">

  <option value="">
    Choisir un mode de contact
  </option>

  <option value="email">
    📧 Par email
  </option>

  <option value="phone">
    📱 Par téléphone
  </option>

</select>

<input
  id="contactValue"
  placeholder="Votre email ou numéro"
  style="margin-top:12px;"
/>
    <button class="btn btn-primary full" id="submitAd">Envoyer pour validation</button>
    <p id="postMessage"></p>
    <a href="index.html">Retour accueil</a>
  </main>
</body>
</html>
